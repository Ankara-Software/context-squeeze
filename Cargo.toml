[package]
name = "context-squeeze"
version = "0.1.0"
edition = "2021"
authors = ["Anilcan Kara"]
description = "MCP Context Optimizer & Token Saver written in Rust"
license = "MIT"
repository = "https://github.com/Ankara-Software/context-squeeze"
homepage = "https://ankarayazilim.org/acik-kaynak/context-squeeze"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
ignore = "0.4"
clap = { version = "4.4", features = ["derive"] }
